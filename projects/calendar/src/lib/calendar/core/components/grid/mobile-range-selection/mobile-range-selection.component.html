@if (mobileSelectionActive) {
    <div class="mobile-selection"
         [style.top.px]="selectionTop"
         [style.height.px]="selectionHeight"
         (touchstart)="onBoxTouchStart($event)"
         (touchend)="onBoxTouchEnd(); $event.stopPropagation()">
        <img class="mobile-selection__marker mobile-selection__marker--top-left" src="assets/icons/mobile-selection-marker.svg" alt="">
        <div class="mobile-selection__title">Потягніть, щоб обрати діапазон часу</div>
        <img class="mobile-selection__marker mobile-selection__marker--bottom-right" src="assets/icons/mobile-selection-marker.svg" alt="">
    </div>

    <div class="mobile-selection-bar"
         (touchstart)="$event.stopPropagation()"
         (touchend)="$event.stopPropagation()">
        <button mat-flat-button color="primary"
                class="mobile-selection-bar__button"
                (click)="confirmMobileSelection()">
            Обрати {{ selectionStart | date:'HH:mm' }}-{{ selectionEnd | date:'HH:mm' }}
        </button>
    </div>
}
