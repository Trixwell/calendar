@switch (view()){
    @case(CalendarView.MONTH){
        <div class="event-month"
             [class.past]="isPast()"
             [class.time-off]="isTimeOff()"
             [style.top.px]="top()"
             [style.height.px]="height()"
             [style.background-color]="isTimeOff() ? null : lightColor()">
            <div class="event-month-attributes">
                <span class="dot" [style.background-color]="isTimeOff() ? null : color()"></span>
                <div class="time">
                    <span>{{ event().getStart() | date:'HH:mm' }}</span>
                </div>
                <div class="title">
                    <span>
                        {{ title() }}
                    </span>
                </div>
            </div>
        </div>
    }
    @default {
        <div class="event-block"
             [class.past]="isPast()"
             [class.time-off]="isTimeOff()"
             [style.top.px]="top()"
             [style.height.px]="height()"
             [style.background-color]="isTimeOff() ? null : lightColor()"
             [style.border-left-color]="isTimeOff() ? null : color()">
            <div class="event-block-attributes">
                <div class="time">
                    <span>{{ event().getStart() | date:'HH:mm' }}
                        – {{ event().getEnd() | date:'HH:mm' }}</span>
                </div>
                <div class="title">
                    <span>
                        {{ title() }}
                    </span>
                </div>
            </div>
        </div>
    }
}
