<div class="calendar-day-slider">
    @for (sliderDay of visibleDays(); track sliderDay.getTime()) {
        <button
            type="button"
            class="calendar-day-slider__day"
            [class.calendar-day-slider__day--selected]="isSelectedDay(sliderDay)"
            [class.calendar-day-slider__day--no-record]="!hasRecord(sliderDay)"
            (click)="day.set(sliderDay)">
            <p class="calendar-day-slider__weekday">{{ sliderDay | date:'EEEEEE':undefined:'uk-UA' }}</p>
            <p class="calendar-day-slider__date">{{ sliderDay | date:'d':undefined:'uk-UA' }}</p>
            <app-load-percent [date]="sliderDay" [taskList]="taskList()" />
        </button>
    }
</div>
